[project]
name = "mktmtm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yalt8826", email = "YASHAS040825@proton.me" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "streamlit>=1.59.1",
    "typer>=0.27.1",
    "uvicorn>=0.52.3",
]

[project.scripts]
mktmtm = "mktmtm:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
]
