[project]
name = "mktmtm"
version = "0.1.0"
description = "Market data, research, ranking, and model system"
readme = "README.md"
authors = [
    { name = "Yalt8826", email = "YASHAS040825@proton.me" }
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "psycopg2-binary>=2.9.12",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "pytz>=2026.3.post1",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
    "streamlit>=1.59.1",
    "typer>=0.27.1",
    "uvicorn>=0.52.3",
]

[project.scripts]
mktmtm = "mktmtm.cli:main"
mktmtm-api = "mktmtm.api:main"
mktmtm-ui = "mktmtm.frontend:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pandas-stubs>=3.0.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.3",
    "types-pytz>=2026.1.1",
    "types-python-dateutil>=2.9.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: requires a live PostgreSQL connection (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src/mktmtm"]
exclude = [
    "src/mktmtm/frontend_app.py",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
